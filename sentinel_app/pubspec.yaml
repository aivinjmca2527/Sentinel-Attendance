name: sentinel_app
description: "Sentinel — Enterprise Attendance Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase Backend
  supabase_flutter: ^2.9.0

  # State Management
  provider: ^6.1.2

  # Routing
  go_router: ^14.8.1

  # Secure Storage (session persistence)
  flutter_secure_storage: ^9.2.4

  # Typography
  google_fonts: ^6.2.1

  # Date/Time formatting
  intl: ^0.20.2

  # Environment variables
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
