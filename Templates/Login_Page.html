<body class="bg-background min-h-screen flex items-center justify-center relative overflow-hidden font-body-lg text-on-background">
<!-- Subtle Background Elements -->
<div class="absolute inset-0 z-0 bg-grid-pattern opacity-40 pointer-events-none"></div>
<div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-primary-fixed/20 to-transparent pointer-events-none z-0"></div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-md px-margin-mobile md:px-0">
<!-- Brand Header inside card for mobile, outside for desktop (using responsive classes) -->
<div class="text-center mb-lg">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-primary-container text-on-primary shadow-sm mb-md">
<span class="material-symbols-outlined text-headline-lg" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary">Sentinel</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Enterprise Attendance Security</p>
</div>
<!-- Login Card -->
<div class="bg-surface border border-border shadow-sm rounded-xl p-lg md:p-xl w-full">
<form action="#" method="POST" class="space-y-lg">
<!-- Email Field -->
<div>
<label for="email" class="block font-label-md text-label-md text-on-surface mb-sm">Corporate Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">mail</span>
</div>
<input type="email" name="email" id="email" class="block w-full pl-10 pr-3 py-2 border border-border rounded-md bg-surface text-on-surface font-body-md placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors" placeholder="user@company.com" required="">
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-sm">
<label for="password" class="block font-label-md text-label-md text-on-surface">Password</label>
<a href="#" class="font-body-sm text-body-sm text-secondary hover:text-primary transition-colors">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">lock</span>
</div>
<!-- Use JetBrains Mono for password input as per style guidelines -->
<input type="password" name="password" id="password" class="block w-full pl-10 pr-10 py-2 border border-border rounded-md bg-surface text-on-surface font-label-md placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors font-mono tracking-widest" placeholder="••••••••" required="">
<button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-primary transition-colors focus:outline-none">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me & Admin Note -->
<div class="flex items-center justify-between">
<div class="flex items-center">
<input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-secondary focus:ring-secondary border-border rounded bg-surface">
<label for="remember-me" class="ml-2 block font-body-sm text-body-sm text-on-surface-variant">
                            Remember me
                        </label>
</div>
</div>
<!-- Admin/Manager 2FA Note -->
<div class="bg-surface-container-low border border-outline-variant/30 rounded-lg p-3 flex items-start space-x-3">
<span class="material-symbols-outlined text-on-surface-variant mt-0.5 text-[18px]">verified_user</span>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-tight">
                        Managers and Admin roles will be required to provide a TOTP code on the next step.
                    </p>
</div>
<!-- Submit Button -->
<button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm font-label-md text-label-md text-white bg-[#0F172A] hover:bg-[#1E293B] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition-colors duration-200">
                    Sign In to Portal
                </button>
</form>
</div>
<!-- Footer Links -->
<div class="mt-lg text-center font-body-sm text-body-sm text-on-surface-variant flex justify-center space-x-md">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<span>•</span>
<a class="hover:text-primary transition-colors" href="#">IT Support</a>
</div>
</main>
<!-- Suppressed Shared Components: SideNav and TopNav are omitted per instructions for transactional/login screens. -->
