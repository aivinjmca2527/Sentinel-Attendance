<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sentinel — Set Up Two-Factor Authentication</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">

  <div class="login-bg-grid"></div>
  <div class="login-bg-gradient"></div>

  <div class="login-container" style="max-width:460px;">

    <div class="brand-header">
      <div class="brand-icon"><i class="fa-solid fa-shield-halved"></i></div>
      <h1>Sentinel</h1>
      <p class="subtitle">Two-Factor Authentication Setup</p>
    </div>

    <div class="login-card" id="setupCard">

      <div class="totp-step" id="stepLoading">
        <div style="text-align:center;padding:2rem 0;">
          <i class="fa-solid fa-circle-notch fa-spin" style="font-size:2rem;color:#2563eb;"></i>
          <p style="margin-top:1rem;color:#64748b;">Generating your authenticator code…</p>
        </div>
      </div>

      <div class="totp-step" id="stepSetup" style="display:none;">
        <div class="totp-intro">
          <i class="fa-solid fa-mobile-screen-button totp-big-icon"></i>
          <h2>Scan QR Code</h2>
          <p>Your account requires two-factor authentication. Scan the QR code below with <strong>Google Authenticator</strong>, <strong>Authy</strong>, or any TOTP app.</p>
        </div>

        <div class="qr-container">
          <img id="qrImage" src="" alt="TOTP QR Code" />
        </div>

        <div class="secret-box">
          <span class="secret-label">Manual entry key:</span>
          <code id="totpSecret"></code>
        </div>

        <div class="field" style="margin-top:1.5rem;">
          <label for="totpCode">Enter the 6-digit code to confirm</label>
          <div class="input-wrap">
            <i class="fa-solid fa-key input-icon"></i>
            <input type="text" id="totpCode" placeholder="000 000" maxlength="7"
                   autocomplete="one-time-code" inputmode="numeric" />
          </div>
        </div>

        <p id="totpError" class="error-msg" style="display:none;"></p>

        <button type="button" id="verifyBtn" class="submit-btn" style="margin-top:1rem;">
          Verify & Activate
        </button>
      </div>

    </div>

    <div class="footer-links">
      <a href="index.html">← Back to Sign In</a>
    </div>

  </div>

<script src="js/app.js"></script>
<script src="js/totp-setup.js"></script>
</body>
</html>
